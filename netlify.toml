# TanStack Start (SSR) on Netlify. NOT a Vite SPA: no index.html fallback / catch-all redirect.
# The build uses Nitro; NITRO_PRESET=netlify emits Netlify Functions + static assets.
# Publish dir is set by Nitro's Netlify output (Frameworks API). Not deployed yet. Secrets go in Netlify environment variables, never in source or VITE_* vars.
[build]
  command = "bun run build"

[build.environment]
  NITRO_PRESET = "netlify"
