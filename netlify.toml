# TanStack Start (SSR) on Netlify. NOT a Vite SPA: no index.html fallback / catch-all redirect.
# The build uses Nitro; NITRO_PRESET=netlify emits Netlify Functions + static assets.
# Explicit publish directory overrides the site's legacy dist/client setting.
# Nitro 3's Netlify preset writes public assets to dist and SSR functions to .netlify.
# Secrets go in Netlify environment variables, never in source or VITE_* vars.
[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NITRO_PRESET = "netlify"
